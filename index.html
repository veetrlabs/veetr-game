<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veetr Wind Run - Open Source Sailing Instruments</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-shell">
      <canvas id="game" aria-label="Veetr Wind Run game"></canvas>

      <section class="hud" aria-label="Game status">
        <div class="brand"><span>VEETR</span><small>Wind Run</small></div>
        <div class="stats">
          <span>Wind data <strong id="score">0</strong></span>
          <span>Hull <strong id="lives">3</strong></span>
          <span>Best run <strong id="best">0</strong></span>
        </div>
      </section>

      <a class="veetr-link" href="https://veetr.org" target="_blank" rel="noopener" aria-label="Learn more about Veetr">
        <span>veetr.org</span>
      </a>

      <button class="round-button pause-button" id="pauseButton" type="button" aria-label="Pause">
        <span id="pauseIcon">Ⅱ</span>
      </button>

      <div class="touch-pad" id="touchPad" aria-hidden="true">
        <div class="touch-stick" id="touchStick"></div>
      </div>

      <section class="overlay is-visible" id="overlay" aria-live="polite">
        <div class="overlay-panel">
          <div class="eyebrow">Open-source sailing instruments</div>
          <h1 id="overlayTitle">Veetr Wind Run</h1>
          <p id="overlayText">Collect wind data across the course and outrun proprietary lock-in.</p>
          <div class="overlay-actions">
            <button id="startButton" type="button">Start Demo</button>
            <a href="https://veetr.org" target="_blank" rel="noopener">Build your dashboard</a>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="game.js"></script>
  </body>
</html>
